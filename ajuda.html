<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Suporte — Deliane Santos Advocacia Educacional. Tire suas dúvidas com nossa assistente.">
  <meta name="theme-color" content="#001D3D">
  <link rel="icon" type="image/svg+xml" href="Logo/favicon.svg">
  <title>Suporte — Deliane Santos Advocacia Educacional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF9F6',
            gold: { DEFAULT: '#C5943E', light: '#D4AD5E', dark: '#A67A2E' },
            navy: { DEFAULT: '#001D3D', deep: '#001428', light: '#002952' },
            gray: { DEFAULT: '#3D4550', light: '#5C6470', muted: '#6B7280' },
          },
          fontFamily: {
            display: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Lato', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="site.css">
  <style>
    .chat-shell { max-width: 560px; margin-inline: auto; }
    .chat-card {
      background: #fff; border: 1px solid rgba(0,29,61,0.1); border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0,29,61,0.12); overflow: hidden;
      display: flex; flex-direction: column; height: min(70vh, 620px);
    }
    .chat-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: #001D3D; border-bottom: 1px solid rgba(197,148,62,0.3);
    }
    .chat-avatar {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
      border: 2px solid rgba(197,148,62,0.6); background: #001428; flex-shrink: 0;
    }
    .chat-status { display: flex; align-items: center; gap: 6px; }
    .chat-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #25D366;
      box-shadow: 0 0 0 0 rgba(37,211,102,0.6); animation: blink-online 1.6s ease-in-out infinite;
    }
    @keyframes blink-online {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(37,211,102,0.55); }
      50% { opacity: 0.45; box-shadow: 0 0 0 6px rgba(37,211,102,0); }
    }
    .chat-body {
      flex: 1; overflow-y: auto; padding: 18px; background: #F4F6F9;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
    .msg-bot { align-self: flex-start; }
    .msg-user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .bubble { padding: 11px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; }
    .bubble-bot { background: #fff; color: #1f2937; border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(0,29,61,0.06); }
    .bubble-user { background: #001D3D; color: #FAF9F6; border-bottom-right-radius: 5px; }
    .bubble a.inline-link { color: #A67A2E; font-weight: 800; text-decoration: underline; }
    .bubble-user a.inline-link { color: #D4AD5E; }
    .bubble .wa-btn {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
      background: #25D366; color: #fff; font-weight: 800; font-size: 13.5px;
      padding: 9px 14px; border-radius: 10px; text-decoration: none;
    }
    .bubble .wa-btn svg { width: 17px; height: 17px; }
    .typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #9aa6b2;
      animation: typing-bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes typing-bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }
    .chat-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 0; }
    .chip {
      background: rgba(197,148,62,0.1); border: 1px solid rgba(197,148,62,0.4);
      color: #A67A2E; border-radius: 100px; padding: 7px 13px; font-size: 13px;
      font-weight: 700; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .chip:hover { background: rgba(197,148,62,0.2); }
    .chat-input { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid rgba(0,29,61,0.08); background: #fff; }
    .chat-input input {
      flex: 1; border: 1.5px solid rgba(0,29,61,0.18); border-radius: 12px;
      padding: 12px 14px; font-size: 14.5px; color: #001D3D; outline: none;
    }
    .chat-input input:focus { border-color: #C5943E; box-shadow: 0 0 0 3px rgba(197,148,62,0.18); }
    .chat-send {
      width: 46px; flex-shrink: 0; border: none; border-radius: 12px; background: #C5943E;
      color: #001D3D; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .chat-send:hover { background: #A67A2E; }
    .chat-send svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav class="nav-wrap" aria-label="Navegação principal">
    <div class="flex items-center justify-between h-[60px] px-4 sm:px-5 gap-3">
      <a href="escola-legal.html" class="flex items-center min-w-0 shrink-0">
        <img src="Logo/Deliane-Logo-Institucional.svg" alt="Deliane Santos — Advocacia Educacional" class="h-9 sm:h-10 w-auto">
      </a>
      <div class="flex items-center gap-1 sm:gap-2">
        <a href="escola-legal.html" class="nav-link">Escola Legal</a>
        <a href="ajuda.html" class="nav-link is-active">Ajuda</a>
      </div>
    </div>
  </nav>

  <main class="hero-section" style="min-height:100vh;">
    <div class="relative z-[2] page-shell">
      <div class="text-center max-w-xl mx-auto mb-8">
        <span class="eyebrow eyebrow--light">Central de Ajuda</span>
        <h1 class="font-display text-[clamp(28px,5vw,42px)] font-bold leading-tight text-white">Como podemos ajudar?</h1>
        <p class="text-white/75 text-[15px] mt-2">Tire suas dúvidas com a nossa assistente de Suporte.</p>
      </div>

      <div class="chat-shell">
        <div class="chat-card">
          <!-- Cabeçalho -->
          <div class="chat-head">
            <img src="Logo/Logo-chat.png" alt="Suporte" class="chat-avatar">
            <div>
              <p class="text-white font-bold text-[16px] leading-tight">Suporte</p>
              <div class="chat-status">
                <span class="chat-dot"></span>
                <span class="text-[#25D366] text-[12.5px] font-bold">online</span>
              </div>
            </div>
          </div>

          <!-- Mensagens -->
          <div class="chat-body" id="chatBody"></div>

          <!-- Sugestões -->
          <div class="chat-chips" id="chatChips"></div>

          <!-- Entrada -->
          <form class="chat-input" id="chatForm" autocomplete="off">
            <input type="text" id="chatInput" placeholder="Escreva sua dúvida..." aria-label="Sua dúvida">
            <button type="submit" class="chat-send" aria-label="Enviar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    const WA = 'https://wa.me/5511957542911';
    const avatar = 'Logo/Logo-chat.png';

    // ---- Base de conhecimento (respostas prontas — editáveis) ----
    const FAQ = [
      {
        id: 'escola_legal',
        chip: 'O que é a Escola Legal?',
        desc: 'O que é a assessoria jurídica Escola Legal / o programa de assessoria',
        keys: ['escola legal', 'assessoria', 'assessoria juridica', 'programa', 'o que e a escola'],
        a: 'A <strong>Escola Legal</strong> é a assessoria jurídica completa, personalizada e contínua da Dra. Deliane Santos para escolas que buscam crescimento, segurança, organização e fortalecimento institucional. 💼<br><br>Você pode conhecer todos os detalhes e a condição de adesão aqui: <a class="inline-link" href="escola-legal.html">página da Escola Legal</a>.'
      },
      {
        id: 'valores',
        chip: 'Valores e condições',
        desc: 'Preço, valores, mensalidade, condição de adesão, formas de pagamento, PIX',
        keys: ['valor', 'valores', 'preco', 'preço', 'quanto custa', 'mensalidade', 'condicao', 'condição', 'adesao', 'adesão', 'pagamento', 'pix'],
        a: 'As condições de adesão da <strong>Escola Legal</strong> são exclusivas para as escolas parceiras, com uma oferta especial para as primeiras escolas aderentes. 💛<br><br>Os valores e a forma de pagamento (inclusive via PIX) ficam todos na <a class="inline-link" href="escola-legal.html">página da Escola Legal</a>. Se preferir um atendimento direto, é só chamar a gente.'
      },
      {
        id: 'contato',
        chip: 'Falar com a Dra. Deliane',
        desc: 'Falar com um humano, contato, telefone, WhatsApp, agendar, atendimento, e-mail, horários',
        keys: ['falar', 'contato', 'atendimento', 'telefone', 'whatsapp', 'humano', 'pessoa', 'agendar', 'reuniao', 'reunião', 'horario', 'horário', 'email', 'e-mail'],
        a: 'Claro! O atendimento direto é feito pela nossa equipe. 😊 É só tocar no botão abaixo que você fala com a gente no WhatsApp.',
        wa: true
      },
    ];

    const fallback = 'Essa eu prefiro não responder por aqui pra não te passar nada impreciso. 🙏<br><br>O melhor é falar diretamente com a nossa equipe — assim você recebe uma orientação certinha:';

    const chatBody = document.getElementById('chatBody');
    const chatChips = document.getElementById('chatChips');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    function scrollDown() { chatBody.scrollTop = chatBody.scrollHeight; }

    function addUser(text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg msg-user';
      wrap.innerHTML = '<div class="bubble bubble-user"></div>';
      wrap.querySelector('.bubble').textContent = text;
      chatBody.appendChild(wrap); scrollDown();
    }

    function addBot(html, withWa) {
      const wrap = document.createElement('div');
      wrap.className = 'msg msg-bot';
      let inner = '<img src="' + avatar + '" class="msg-avatar" alt="Suporte"><div class="bubble bubble-bot">' + html;
      if (withWa) {
        inner += '<br><a class="wa-btn" href="' + WA + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="#fff"><path d="M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 0 0 1.51 5.26l-.999 3.648 3.978-1.515zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>' +
          'Falar no WhatsApp</a>';
      }
      inner += '</div>';
      wrap.innerHTML = inner;
      chatBody.appendChild(wrap); scrollDown();
    }

    function showTyping() {
      const wrap = document.createElement('div');
      wrap.className = 'msg msg-bot'; wrap.id = 'typingRow';
      wrap.innerHTML = '<img src="' + avatar + '" class="msg-avatar" alt="Suporte"><div class="bubble bubble-bot"><span class="typing"><span></span><span></span><span></span></span></div>';
      chatBody.appendChild(wrap); scrollDown();
    }
    function hideTyping() { const t = document.getElementById('typingRow'); if (t) t.remove(); }

    function normalize(s) {
      return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function findAnswerLocal(text) {
      const t = normalize(text);
      let best = null, bestScore = 0;
      FAQ.forEach(item => {
        let score = 0;
        item.keys.forEach(k => { if (t.includes(normalize(k))) score += normalize(k).split(' ').length; });
        if (score > bestScore) { bestScore = score; best = item; }
      });
      return bestScore > 0 ? best : null;
    }
    function findById(id) { return FAQ.find(f => f.id === id) || null; }
    function aiRoute(text) {
      const topics = FAQ.map(f => ({ id: f.id, desc: f.desc }));
      return fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, topics })
      })
        .then(r => r.ok ? r.json() : { id: 'none' })
        .then(d => (d && d.id) ? d.id : 'none')
        .catch(() => 'none');
    }

    function respond(text) {
      showTyping();
      const local = findAnswerLocal(text);
      if (local) {
        setTimeout(() => { hideTyping(); addBot(local.a, !!local.wa); }, 600 + Math.random() * 450);
        return;
      }
      aiRoute(text).then(id => {
        hideTyping();
        const item = findById(id);
        if (item) addBot(item.a, !!item.wa);
        else addBot(fallback, true);
      });
    }

    function sendMessage(text) {
      const clean = text.trim();
      if (!clean) return;
      addUser(clean);
      respond(clean);
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(chatInput.value);
      chatInput.value = '';
    });

    // Chips de sugestão
    FAQ.forEach(item => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = item.chip;
      b.addEventListener('click', () => sendMessage(item.chip));
      chatChips.appendChild(b);
    });

    // Mensagem de boas-vindas
    window.addEventListener('load', () => {
      setTimeout(() => addBot('Olá! 👋 Eu sou a assistente de <strong>Suporte</strong> da Dra. Deliane Santos. Posso tirar suas dúvidas sobre a assessoria, o Café com a Lei e as inscrições.<br><br>Escolha um assunto abaixo ou escreva sua pergunta. 💬'), 350);
    });
  </script>

</body>
</html>
